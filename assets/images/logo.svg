<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle Background -->
    <rect width="80" height="80" rx="20" fill="#0F2C59" />
    <!-- Warm Accent Glow -->
    <circle cx="40" cy="40" r="30" fill="#0D9488" fill-opacity="0.2" />
    
    <!-- Caring Hands Cradling House & Heart -->
    <!-- House Roof -->
    <path d="M40 22L23 37H29V56H51V37H57L40 22Z" fill="#F8FAFC" />
    <!-- Heart / Medical Cross in Home -->
    <path d="M40 33C37.5 30 33 30.5 33 34.5C33 38.5 40 43.5 40 43.5C40 43.5 47 38.5 47 34.5C47 30.5 42.5 30 40 33Z" fill="#0D9488" />
    <!-- Caring Hand Arc -->
    <path d="M22 52C26 62 42 66 54 58" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 18)">
    <!-- Brand Title -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F2C59" letter-spacing="-0.5">SUGAM</text>
    <text x="116" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0D9488" letter-spacing="-0.5">HOME CARE</text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569" letter-spacing="2.5">SERVICES • CHENNAI</text>
    <path d="M2 64H235" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
